<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lane Runner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="error-display" style="position: absolute; top: 10px; right: 10px; background: rgba(255,0,0,0.8); color: white; padding: 10px; font-family: monospace; font-size: 11px; max-width: 300px; display: none; z-index: 1000;"></div>
        <div id="ui">
            <div id="stats">
                <div id="army-count">ARMY: <span id="army-number">30</span></div>
                <div id="weapon-info">WEAPON: <span id="weapon-name">PISTOL</span></div>
                <div id="troop-info">TROOP: <span id="troop-name">SOLDIER</span></div>
                <div id="controls-hint" style="font-size: 10px; color: rgba(100, 149, 237, 0.7); margin-top: 8px;">
                    1-4: Switch Weapon | A/D: Move
                </div>
            </div>
            <div id="game-over" class="hidden">
                <h2 id="game-over-text">GAME OVER</h2>
                <div id="stats-display">
                    <div class="stat-line">ENEMIES KILLED: <span id="stat-kills">0</span></div>
                    <div class="stat-line">MAX ARMY SIZE: <span id="stat-max-army">0</span></div>
                    <div class="stat-line">FINAL WEAPON: <span id="stat-weapon">-</span></div>
                    <div class="stat-line">FINAL TROOP: <span id="stat-troop">-</span></div>
                    <div class="stat-line">TIME: <span id="stat-time">0s</span></div>
                </div>
                <button id="restart-btn">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/audio-file.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/player.js"></script>
    <script src="js/gates.js"></script>
    <script src="js/enemies.js"></script>
    <script src="js/game.js"></script>
    <script>
        // Capture console errors and display on screen
        const errorDisplay = document.getElementById('error-display');
        const originalConsoleError = console.error;
        console.error = function(...args) {
            originalConsoleError.apply(console, args);
            errorDisplay.style.display = 'block';
            errorDisplay.textContent = args.join(' ');
        };

        window.onerror = function(msg, url, line, col, error) {
            errorDisplay.style.display = 'block';
            errorDisplay.textContent = `Error: ${msg}\nLine: ${line}\n${error ? error.stack : ''}`;
            return false;
        };
    </script>
</body>
</html>
