<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Select - Zombie Survival Shooter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            font-family: 'Orbitron', sans-serif;
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 48px;
            margin-bottom: 20px;
            color: #8BC34A;
            text-shadow: 0 0 20px rgba(139, 195, 74, 0.5);
        }

        .stats-bar {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 8px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .survivor-points {
            font-size: 24px;
            color: #FFD700;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .level-card {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.8) 0%, rgba(30, 20, 10, 0.8) 100%);
            border: 3px solid rgba(139, 115, 85, 0.4);
            border-radius: 12px;
            padding: 25px;
            position: relative;
            transition: all 0.3s;
        }

        .level-card.unlocked {
            border-color: #8BC34A;
            cursor: pointer;
        }

        .level-card.unlocked:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(139, 195, 74, 0.3);
            border-color: #A0D468;
        }

        .level-card.locked {
            opacity: 0.5;
            filter: grayscale(1);
        }

        .level-number {
            position: absolute;
            top: -15px;
            left: 20px;
            background: #8BC34A;
            color: #0a0a0a;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .level-card.locked .level-number {
            background: #666;
        }

        .level-title {
            font-size: 24px;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #D4C5B9;
        }

        .level-description {
            font-size: 14px;
            color: #A0826D;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .level-stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #8BC34A;
            margin-bottom: 15px;
        }

        .play-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #8BC34A 0%, #7AB839 100%);
            color: #0a0a0a;
            border: none;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s;
        }

        .play-button:hover {
            background: linear-gradient(135deg, #A0D468 0%, #8BC34A 100%);
            transform: scale(1.05);
        }

        .locked-text {
            text-align: center;
            padding: 12px;
            background: rgba(255, 0, 0, 0.2);
            border-radius: 6px;
            color: #ff6666;
        }

        .back-button {
            display: inline-block;
            padding: 15px 30px;
            background: rgba(100, 100, 100, 0.5);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .back-button:hover {
            background: rgba(100, 100, 100, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧟 ZOMBIE SURVIVAL SHOOTER</h1>

        <div class="stats-bar">
            <div class="survivor-points">
                💰 Survivor Points: <span id="points-display">0</span>
            </div>
            <div>
                <a href="#" class="back-button" id="meta-button">Upgrades</a>
            </div>
        </div>

        <div class="level-grid" id="level-grid">
            <!-- Levels will be populated here -->
        </div>

        <div style="text-align: center;">
            <button class="back-button" onclick="saveSystem.reset(); location.reload();" style="background: rgba(255, 0, 0, 0.3);">
                Reset Save Data (Debug)
            </button>
        </div>
    </div>

    <script src="js/levels.js"></script>
    <script src="js/save.js"></script>
    <script>
        // Load and display levels
        function init() {
            const saveData = saveSystem.load();
            const levels = getAllLevels();
            const grid = document.getElementById('level-grid');
            const pointsDisplay = document.getElementById('points-display');

            // Display survivor points
            pointsDisplay.textContent = saveData.survivorPoints;

            // Create level cards
            levels.forEach(level => {
                const unlocked = isLevelUnlocked(level.id, saveData);
                const highScore = saveSystem.getLevelScore(level.id);

                const card = document.createElement('div');
                card.className = `level-card ${unlocked ? 'unlocked' : 'locked'}`;

                card.innerHTML = `
                    <div class="level-number">${level.id}</div>
                    <div class="level-title">${level.name}</div>
                    <div class="level-description">${level.description}</div>
                    ${highScore ? `
                        <div class="level-stats">
                            <span>Kills: ${highScore.kills}</span>
                            <span>Time: ${Math.floor(highScore.time)}s</span>
                            ${highScore.flawless ? '<span>⭐ FLAWLESS</span>' : ''}
                        </div>
                    ` : ''}
                    ${unlocked ?
                        `<button class="play-button" onclick="playLevel(${level.id})">PLAY</button>` :
                        `<div class="locked-text">🔒 Complete Level ${level.requiredLevel} to unlock</div>`
                    }
                `;

                grid.appendChild(card);
            });
        }

        function playLevel(levelId) {
            // Store selected level in sessionStorage
            sessionStorage.setItem('selectedLevel', levelId);
            // Navigate to game
            window.location.href = 'index.html';
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
